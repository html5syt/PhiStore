name: Godot Auto Build

on:
  schedule:
    - cron: '5 10 * * 5,6'  # 每周五、六的10:05 UTC
  workflow_dispatch:         # 允许手动触发
  push:                      # 添加推送事件触发
    branches: [ Godot ]       # 指定触发分支

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-update:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-update.outputs.should_build }}
      new_version: ${{ steps.check-update.outputs.new_version }}
    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
        uses: actions/checkout@v4

      - name: Skip check if manual trigger or push
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: echo "FORCE_BUILD=true" >> $GITHUB_ENV
        id: skip-check

      - name: Get remote version
        run: |
          REMOTE_VER=$(curl -s https://raw.githubusercontent.com/html5syt/Phigros_Resource/master/version.txt)
          echo "REMOTE_VER=$REMOTE_VER" >> $GITHUB_ENV

      - name: Get local version
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
        run: |
          LOCAL_VER=$(awk -F= '/^\[application\]/{i=1;next}/^\[/{i=0}i&&$1=="config/version"{gsub(/^[ \t"]+|[ \t"]+$/,"",$2);print $2;exit}' src/project.godot)
          echo "LOCAL_VER=$LOCAL_VER" >> $GITHUB_ENV

      - name: Compare versions
        id: check-update
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "new_version=$REMOTE_VER" >> $GITHUB_OUTPUT
          elif [ "$REMOTE_VER" = "$LOCAL_VER" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "new_version=$REMOTE_VER" >> $GITHUB_OUTPUT
          fi

  update-version:
    name: Update Game Version
    runs-on: ubuntu-latest
    needs: check-update
    if: ${{ needs.check-update.outputs.should_build == 'true' }}
    outputs:
      new_version: ${{ steps.set-version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set new version
        id: set-version
        run: |
          NEW_VERSION=${{ needs.check-update.outputs.new_version }}
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update project.godot
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
        run: |
          cd src
          sed -i "/\[application\]/,/config\/version/s/config\/version *= *\".*\"/config\/version = \"$NEW_VERSION\"/" project.godot

      - name: Commit changes
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/project.godot
          git commit -m "Update version to $NEW_VERSION"
          git push

      - name: Set tag
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}
        run: |
          git tag v$NEW_VERSION
          git push origin v$NEW_VERSION

  # Windows平台构建
  build-windows:
    name: Build Windows Platforms
    needs: update-version
    if: ${{ always() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform: ["windows", "android", "web"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.0-beta.6"
          use-dotnet: false

      - name: Install custom export templates
        run: |
          # 定义目标目录路径
          templateDir="$HOME/AppData/Roaming/Godot/export_templates/4.5.beta5"

          # 创建目录（-p 参数确保父目录不存在时也会创建）
          mkdir -p "$templateDir"

          # 复制模板文件（-r 递归复制，-v 显示详细输出）
          cp -rv ./build-templates/* "$templateDir/"

      - name: Setup Java For Android Build
        uses: actions/setup-java@v4
        if: ${{ matrix.platform == 'android' }}
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 60
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ../html5syt.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER}}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD}}
        run: |
          # 创建构建目录
          mkdir -p builds
          mkdir -p "builds/${{ matrix.platform }}"

          # 进入 src 目录并检查 Godot 版本
          cd src
          godot --version
          godot --headless --import

          # 根据平台执行不同的导出命令
          case "${{ matrix.platform }}" in
            "windows")
              godot --headless --export-release "PhiStore-Windows" "../builds/windows/PhiStore.exe" 
              ;;
            "android")
              godot --headless  --install-android-build-template --export-release "PhiStore-Android" "../builds/android/PhiStore.apk" 
              ;;
            "web")
              godot --headless --export-release "PhiStore-Web" "../builds/web/index.html" 
              ;;
          esac

          # 返回上级目录并列出构建文件
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ matrix.platform }}
          path: builds
          retention-days: 1

      - name: Setup Pages
        if: ${{ matrix.platform == 'web' && success() }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ matrix.platform == 'web' && success() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'builds/web'
      - name: Deploy to GitHub Pages
        if: ${{ matrix.platform == 'web' && success() }}
        id: deployment
        uses: actions/deploy-pages@v4

  # macOS平台构建
  build-macos:
    name: Build macOS Platforms
    needs: update-version
    if: ${{ always() }}
    runs-on: macos-latest
    strategy:
      matrix:
        platform: ["macos"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.0-beta.6"
          use-dotnet: false

      - name: Install custom export templates
        run: |
          templateDir="$HOME/Library/Application Support/Godot/export_templates/4.5.beta5"
          mkdir -p "$templateDir"
          cp -r build-templates/* "$templateDir/"

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 60
        continue-on-error: true
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p builds
          mkdir -p "builds/${{ matrix.platform }}"
          cd src
          godot --version
          godot --headless --import

          case "${{ matrix.platform }}" in
            "macos")
              godot --headless --export-release "PhiStore-MacOS" "../builds/macos/PhiStore.app" 
              ;;
          esac
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds-${{ matrix.platform }}
          path: builds
          retention-days: 1

  # Linux平台构建
  build-linux:
    name: Build Linux Platform
    needs: update-version
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.0-beta.6"
          use-dotnet: false

      - name: Install custom export templates
        run: |
          templateDir="$HOME/.local/share/godot/export_templates/4.5.beta5"
          mkdir -p "$templateDir"
          cp -r build-templates/* "$templateDir/"

      - name: Build Linux version
        timeout-minutes: 60
        run: |
          mkdir -p builds
          mkdir -p builds/linux
          cd src
          godot --version
          godot --headless --import

          godot --headless --export-release "PhiStore-Linux" "../builds/linux/PhiStore.x86_64" 
          cd ..
          tree -a builds

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds-linux
          path: builds
          retention-days: 1

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: 
      - build-windows
      - build-macos
      - build-linux
    if: ${{ (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get local version
        id: version_info
        run: |
          VERSION=$(awk -F= '/^\[application\]/{i=1;next}/^\[/{i=0}i&&$1=="config/version"{gsub(/^[ \t"]+|[ \t"]+$/,"",$2);print $2;exit}' src/project.godot)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=Release v$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Delete existing release if manual or push trigger
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查release是否存在
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists, deleting..."
            gh release delete "$TAG_NAME" --yes
            # 删除tag
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin --delete "$TAG_NAME" 2>/dev/null || true
          else
            echo "Release $TAG_NAME does not exist, skipping deletion."
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
        
      - name: List and Zip artifacts
        run: |
          tree -a release_assets
          cd release_assets
          find . -mindepth 2 -maxdepth 2 -type d -print0 | while IFS= read -r -d $'\0' dir; do
            dir_name=$(basename "$dir")
            parent_dir=$(dirname "$dir")
            (cd "$parent_dir" && zip -rq "$dir_name.zip" "$dir_name")
            rm -rf "$dir"
            echo "✅ Compressed: $parent_dir/$dir_name.zip"
          done

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body: |
            自动同步Phigros更新： ${{ env.TAG_NAME }}
            由${{ github.event_name == 'workflow_dispatch' && '手动更新' || (github.event_name == 'push' && '推送更新' || '计划更新') }}触发构建
            
            构建Runner平台:
            ${{ needs.build-windows.result == 'success' && '- Windows' || '' }}
            ${{ needs.build-macos.result == 'success' && '- macOS' || '' }}
            ${{ needs.build-linux.result == 'success' && '- Linux' || '' }}

            φ To You!
          files: |
            release_assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}